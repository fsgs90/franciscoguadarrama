<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francisco Guadarrama | Tech Art</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>


<style>
:root{
--bg:#0B0E14;
--text:#d1cdaf;
--accent:#b2f49f;
--card:#111827;
--font-header:"Press Start 2P", monospace;
--font-body:"JetBrains Mono", monospace;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:var(--font-body);
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* CRT SYSTEM OVERLAY */
body::before {
    content: " ";
    display: block;
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 2000;
    background-size: 100% 3px, 3px 100%;
    pointer-events: none;
}

body::after {
    content: " ";
    display: block;
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: rgba(18, 16, 16, 0.1);
    opacity: 0;
    z-index: 2000;
    pointer-events: none;
    animation: flicker 0.15s infinite;
}

@keyframes flicker {
    0% { opacity: 0.1; }
    100% { opacity: 0.15; }
}

#webgl{
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
}

/* NAV */
nav{
position:fixed;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:1.2rem;
background:rgba(5,8,16,0.8);
backdrop-filter:blur(10px);
z-index:10;
}

.nav-links{
display:flex;
gap:2rem;
}

nav a{
font-family:var(--font-header);
font-size:.65rem;
color:var(--text);
opacity:.5;
cursor:pointer;
text-decoration:none;
}

nav a.active,
nav a:hover{
color:var(--accent);
opacity:1;
}

.sfx-toggle{
font-family:var(--font-header);
font-size:.65rem;
color:var(--text);
opacity:.5;
cursor:pointer;
text-decoration:none;
border:1px solid rgba(56,189,248,0.3);
background:rgba(17,24,39,0.5);
padding:.6rem .9rem;
border-radius:4px;
margin-left:1rem;
}

.sfx-toggle:hover{
color:var(--accent);
opacity:1;
background:var(--accent);
color:#000;
}

/* PAGES */
.page{
display:none;
min-height:100vh;
padding-top:120px;
}

.page.active{display:block}

.hero{
height:40vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h1{
font-family:var(--font-header);
font-size:clamp(1.2rem,4vw,2.5rem);
}

.hero p{
color:var(--accent);
letter-spacing:2px;
}

/* REEL SECTION */
.reel {
    max-width: 1000px;
    margin: 3rem auto;
    padding: 0 2rem;
    text-align: center;
}

.reel h2 {
    font-family: var(--font-header);
    font-size: 0.7rem;
    letter-spacing: 2px;
    opacity: 0.5;
    margin-bottom: 1.5rem;
}

.reel-player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid rgba(56,189,248,0.2);
    background: #000;
    transition: 0.3s;
}

.reel-player iframe {
    width: 100%;
    height: 100%;
}

/* FILTERS */
.filter-wrap{
margin-top:20px;
display:flex;
gap:10px;
}

.filter{
font-family:var(--font-header);
font-size:.55rem;
padding:.6rem .9rem;
border:1px solid rgba(56,189,248,0.3);
background:rgba(17,24,39,0.5);
color:var(--text);
cursor:pointer;
}

.filter.active{
background:var(--accent);
color:#000;
}

/* GRID */
.container{
max-width:1000px;
margin:auto;
padding:2rem;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:2rem;
}

/* CARDS */
.card{
background:var(--card);
border-radius:6px;
overflow:hidden;
position:relative;
cursor:pointer;
border:1px solid rgba(255,255,255,0.05);
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
border-color:var(--accent);
}

.card.featured{grid-column:1/3;height:380px}
.card.mid,.card.small{height:300px}

.image{
height:75%;
position:relative;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
opacity:.7;
transition:.5s;
}

.image iframe {
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: auto; 
}

.image::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    pointer-events: none; 
    z-index: 4;
}

.info{
padding:1.2rem;
position:relative;
z-index:5;
}

.info h3{
font-family:var(--font-header);
font-size:.75rem;
margin:0;
text-shadow:0 0 10px rgba(0,0,0,0.9);
}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
display:none;
align-items:center;
justify-content:center;
z-index:2001;
}

.modal.active{display:flex}

.modal-box{
background:#0b1220;
padding:2rem;
border:1px solid var(--accent);
width:min(700px,90vw);
border-radius:8px;
}

#ship {
    position: fixed;
    width: 96px;
    height: 96px;
    pointer-events: none;
    z-index: 100; 
    transform-origin: top right;
    image-rendering: pixelated;
}

#trailCanvas {
    position: fixed;
    inset: 0;
    z-index: 0; 
    pointer-events: none;
}

</style>
</head>

<body>

<canvas id="webgl"></canvas>
<canvas id="trailCanvas"></canvas>

<audio id="ambience" src="assets/sounds/hum.mp3" preload="auto" loop crossorigin="anonymous"></audio>

<img id="ship" src="assets/art/base_saber_anim.gif"/>

<nav>
<button id="sfxToggle" class="sfx-toggle">🔇 SFX</button>
<div class="nav-links">
<a data-page="home" class="active">HOME</a>
<a data-page="resume">RESUME</a>
<a data-page="contact">CONTACT</a>
</div>
</nav>

<div id="home" class="page active">
    <section class="hero">
        <h1>FRANCISCO<br>GUADARRAMA</h1>
        <p>// TECH ARTIST</p>
        <div class="filter-wrap">
            <button class="filter active" data-filter="shaders">SHADERS</button>
            <button class="filter" data-filter="tools">TOOLS</button>
            <button class="filter" data-filter="vfx">VFX</button>
            <button class="filter" data-filter="pixel">PIXEL_ART</button>
            <button class="filter" data-filter="3d">3D</button>
        </div>
    </section>

    <section class="reel">
        <h2>[ DEMO_REEL ]</h2>
        <div class="reel-player">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/pWibE_B-H7w?si=ZTMvOGiCkFYwdGTA" frameborder="0" allowfullscreen></iframe>
        </div>
    </section>

    <div class="container">
        <div class="grid" id="grid"></div>
    </div>
</div>

<div id="resume" class="page"><div class="hero"><h1>RESUME</h1></div></div>
<div id="contact" class="page"><div class="hero"><h1>CONTACT</h1></div></div>

<div id="modal" class="modal">
    <div class="modal-box">
        <h2 id="modalTitle" style="font-family: 'Press Start 2P'; font-size: 0.8rem; margin-bottom: 1rem;"></h2>
        <img id="modalImg" style="width:100%;border-radius:6px;">
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>

<script>
const PROJECTS={
pixel:{
featured:{title:"2D Dynamic Shadow System",img:"https://i.makeagif.com/media/4-26-2026/8c9H56.gif"},
mid:{title:"Procedural Burning Effect",img:"https://i.makeagif.com/media/4-26-2026/NvAZ5q.gif"},
small:{title:"Tile Shader",img:"https://i.imgur.com/cwDTOv8.gif"}
},
shaders:{
featured:{title:"3D Pixel Art Pipeline",img:"https://i.makeagif.com/media/4-26-2026/L1q6OG.gif"},
mid:{title:"Cross-Hatching Shader",img:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMGhpdTVrbWQ3djVoZ3RxcXl2MHA0aXhqMXhwbzY2YnRneGd1NG1laCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/lXiRIV4VyM2sBjvs4/giphy.gif"},
small:{title:"Pixel Water Shader",img:"https://cdnb.artstation.com/p/assets/images/images/014/103/113/original/brendan-sullivan-pixelwatershader1-500.gif?1542479170"}
},
vfx:{
featured:{title:"Stylized Ink Explosion",img:"https://cdna.artstation.com/p/assets/images/images/085/444/508/original/francisco-guadarrama-result.gif?1740791319"},
mid:{title:"Impact System",img:"https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExN2YwN3I1dGRrNmVhOHpnOHAyYTl0Ynp3ZzR6Mmpld2RwbWlsYmF0ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/0V13xjYKqE8AL2T6UK/giphy.gif"},
small:{title:"Energy Field System",img:"https://cdna.artstation.com/p/assets/images/images/085/332/502/original/francisco-guadarrama-2025-02-2518-31-25-ezgif-com-resize.gif?1740537325"}
},
tools:{
featured:{title:"Maya Pipeline Validator",img:"https://i.imgur.com/pptNLiB.gif"},
mid:{title:"Low Poly Tool",img:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnVtODY5eDZ6YjY4NHA0NGd4bDc1dG9lbGk4YzQ1Mjc2bWc1NmFydiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/YfIqRqgD6HxsPTIwfg/giphy.gif"},
small:{title:"Workflow Tool",img:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnVtODY5eDZ6YjY4NHA0NGd4bDc1dG9lbGk4YzQ1Mjc2bWc1NmFydiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/YfIqRqgD6HxsPTIwfg/giphy.gif"}
},
"3d": {
  "featured": { "title": "Character Rigging", "embed": "<iframe src='https://sketchfab.com/models/3aba64fde0264a668899d42a4ad8b98c/embed'></iframe>" },
  "mid": { "title": "Environment Modeling", "embed": "<iframe src='https://sketchfab.com/models/3aba64fde0264a668899d42a4ad8b98c/embed'></iframe>" },
  "small": { "title": "Animation Test", "img": "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOTAwODQ1Y2E2ZDg5MzgyNDk5YzI5YmU1OWYzMTBiYzAxY2JmYTI1YSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/xT9IgEx8SbQ0teblUQ/giphy.gif" }
}
};

class App{
constructor(){
this.ship = document.getElementById("ship");
this.shipPos = { x: innerWidth/2, y: innerHeight/2 };
this.shipTarget = { x: this.shipPos.x, y: this.shipPos.y };

this.audioCtx = null;
this.isSfxMuted = true;
this.velocity = 0;
this.lastMousePos = { x: 0, y: 0 };

this.trailCanvas = document.getElementById("trailCanvas");
this.trailCtx = this.trailCanvas.getContext("2d");
this.trailPoints = [];

this.grid=document.getElementById("grid");
this.modal=document.getElementById("modal");
this.modalTitle=document.getElementById("modalTitle");
this.modalImg=document.getElementById("modalImg");

this.mouse=new THREE.Vector2(.5,.5);
this.target=new THREE.Vector2(.5,.5);
this.bleed=new THREE.Vector4();
this.bleedTarget=new THREE.Vector4();
this.intensity=0;

this.init();
}

init(){
this.initGL();
this.initResize();
this.setupTrail();
this.nav();
this.render("shaders");
this.loop();
}

initResize(){ window.addEventListener("resize",()=>this.onResize()); }

onResize(){
    this.renderer.setSize(innerWidth, innerHeight);
    this.uniforms.u_res.value.set(innerWidth, innerHeight);
    this.trailCanvas.width = innerWidth;
    this.trailCanvas.height = innerHeight;
}

initGL(){
this.renderer=new THREE.WebGLRenderer({canvas:document.getElementById("webgl"),alpha:true});
this.renderer.setSize(innerWidth,innerHeight);
this.scene=new THREE.Scene();
this.camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
this.uniforms={
u_mouse:{value:this.mouse},
u_bleed:{value:this.bleed},
u_intensity:{value:0},
u_res:{value:new THREE.Vector2(innerWidth,innerHeight)},
u_texture:{value:new THREE.TextureLoader().load('assets/art/lightsaber2.png')}
};
const mat=new THREE.ShaderMaterial({
uniforms:this.uniforms,
vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,
fragmentShader:`
precision highp float;
varying vec2 vUv;
uniform vec2 u_mouse;
uniform vec4 u_bleed;
uniform float u_intensity;
uniform vec2 u_res;
void main(){
vec2 uv=vUv;
float aspect=u_res.x/u_res.y;
float d=distance(uv*vec2(aspect,1.),u_mouse*vec2(aspect,1.));
float glow=0.04/(d+0.04);
float edge=smoothstep(.03,0.,abs(uv.x-(u_bleed.x+u_bleed.z*.5))-u_bleed.z*.5)*smoothstep(.15,0.,abs(uv.y-(u_bleed.y+u_bleed.w*.5))-u_bleed.w*.5);
// Boosted CRT Bleed
vec3 col=vec3(0.2,1.0,0.3)*(glow+(edge*u_intensity*.2));
gl_FragColor=vec4(col,(glow+edge)*.5);
}`
});
this.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
}

nav() {
    gsap.registerPlugin(ScrollToPlugin);
    
    // Page switching logic
    document.querySelectorAll("nav a").forEach(a => {
        a.onclick = () => {
            const pid = a.dataset.page;
            document.querySelectorAll("nav a").forEach(l => l.classList.remove("active"));
            a.classList.add("active");
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            document.getElementById(pid).classList.add("active");
            if(pid === "home") gsap.to(window, {duration: 1, scrollTo: 0});
        };
    });

    // CRT Bleed for Nav, SFX, and Filters
    document.querySelectorAll("nav a, .sfx-toggle, .filter").forEach(el => {
        el.addEventListener('mouseenter', () => {
            const r = el.getBoundingClientRect();
            this.bleedTarget.set(r.left / innerWidth, 1 - r.bottom / innerHeight, r.width / innerWidth, r.height / innerHeight);
            this.intensity = 0.7; 
        });
        el.addEventListener('mouseleave', () => this.intensity = 0);
    });

    // CRT Bleed for Demo Reel
    const reel = document.querySelector('.reel-player');
    if(reel) {
        reel.addEventListener('mouseenter', () => {
            const r = reel.getBoundingClientRect();
            this.bleedTarget.set(r.left / innerWidth, 1 - r.bottom / innerHeight, r.width / innerWidth, r.height / innerHeight);
            this.intensity = 1.3; 
        });
        reel.addEventListener('mouseleave', () => this.intensity = 0);
    }

    window.onmousemove = (e) => {
        const dx = e.clientX - this.lastMousePos.x;
        const dy = e.clientY - this.lastMousePos.y;
        this.velocity += (Math.sqrt(dx*dx + dy*dy) - this.velocity) * 0.15;
        this.lastMousePos = { x: e.clientX, y: e.clientY };
        this.addTrailPoint(this.shipPos.x, this.shipPos.y);
        this.target.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
        this.shipTarget.x = e.clientX;
        this.shipTarget.y = e.clientY;
    };
    
    this.modal.onclick = (e) => { if (e.target === this.modal) this.modal.classList.remove("active"); };
    document.getElementById("sfxToggle").onclick = () => this.toggleSfx();
    
    document.querySelectorAll(".filter").forEach(b => {
        b.onclick = () => {
            document.querySelectorAll(".filter").forEach(x => x.classList.remove("active"));
            b.classList.add("active");
            this.render(b.dataset.filter);
        };
    });
}

toggleSfx(){
    if (!this.audioCtx) {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        this.audioEl = document.getElementById("ambience");
        const source = this.audioCtx.createMediaElementSource(this.audioEl);
        this.gainNode = this.audioCtx.createGain();
        this.filterNode = this.audioCtx.createBiquadFilter();
        this.filterNode.type = 'lowpass';
        source.connect(this.filterNode).connect(this.gainNode).connect(this.audioCtx.destination);
    }
    this.isSfxMuted = !this.isSfxMuted;
    if(this.isSfxMuted){ this.audioEl.pause(); document.getElementById("sfxToggle").textContent = "🔇 SFX"; }
    else{ this.audioEl.play(); document.getElementById("sfxToggle").textContent = "🔊 SFX"; }
}

setupTrail(){ this.onResize(); }

addTrailPoint(x,y){
    this.trailPoints.push({x,y,t:Date.now()});
    if(this.trailPoints.length > 150) this.trailPoints.shift();
}

drawTrail() {
    const now = Date.now();
    const ctx = this.trailCtx;
    ctx.clearRect(0, 0, this.trailCanvas.width, this.trailCanvas.height);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.globalCompositeOperation = 'screen'; 
    ctx.shadowBlur = 20; 
    ctx.shadowColor = "rgba(34,197,94,0.4)";

    for (let i = 1; i < this.trailPoints.length; i++) {
        const current = this.trailPoints[i];
        const previous = this.trailPoints[i-1];
        const age = (now - current.t) / 3000; 
        const alpha = Math.max(0, 1 - age);
        if (alpha <= 0) continue;
        ctx.lineWidth = 14; 
        ctx.strokeStyle = `rgba(34,197,94,${alpha * 0.12})`; 
        ctx.beginPath();
        ctx.moveTo(previous.x, previous.y);
        ctx.lineTo(current.x, current.y);
        ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 8;
    ctx.shadowColor = "rgba(150,255,150,0.5)";

    for (let i = 1; i < this.trailPoints.length; i++) {
        const current = this.trailPoints[i];
        const previous = this.trailPoints[i-1];
        const age = (now - current.t) / 700; 
        const alpha = Math.max(0, 1 - age);
        if (alpha <= 0) continue;
        ctx.lineWidth = 6 * alpha + 1; 
        ctx.strokeStyle = `rgba(220,255,220,${alpha * 0.9})`; 
        ctx.beginPath();
        ctx.moveTo(previous.x, previous.y);
        ctx.lineTo(current.x, current.y);
        ctx.stroke();
    }
}

card(d, t) {
    const c = document.createElement("div");
    c.className = `card ${t}`;
    const visual = d.embed ? `<div class="image">${d.embed}</div>` : `<div class="image"><img src="${d.img}"></div>`;
    c.innerHTML = `${visual}<div class="info"><h3>${d.title}</h3></div>`;
    c.onclick = () => {
        this.modal.classList.add("active");
        this.modalTitle.textContent = d.title;
        if (d.embed) { this.modalImg.style.display = "none"; } 
        else { this.modalImg.style.display = "block"; this.modalImg.src = d.img; }
    };
    c.onmouseenter = () => {
        const r = c.getBoundingClientRect();
        this.bleedTarget.set(r.left / innerWidth, 1 - r.bottom / innerHeight, r.width / innerWidth, r.height / innerHeight);
        this.intensity = 1.2;
        
    };
    c.onmouseleave = () => this.intensity = 0;
    return c;
}

render(t){
    const d=PROJECTS[t];
    this.grid.innerHTML="";
    this.grid.appendChild(this.card(d.featured,"featured"));
    this.grid.appendChild(this.card(d.mid,"mid"));
    this.grid.appendChild(this.card(d.small,"small"));
}

loop(){
    if (!this.isSfxMuted && this.gainNode) {
        this.gainNode.gain.setTargetAtTime(0.15 + (this.velocity/120), this.audioCtx.currentTime, 0.1);
        this.filterNode.frequency.setTargetAtTime(450 + (this.velocity * 15), this.audioCtx.currentTime, 0.1);
    }
    this.velocity *= 0.95;
    this.shipPos.x += (this.shipTarget.x - this.shipPos.x) * 0.08;
    this.shipPos.y += (this.shipTarget.y - this.shipPos.y) * 0.08;
    const angle = Math.atan2(this.shipTarget.y - this.shipPos.y, this.shipTarget.x - this.shipPos.x);
    this.ship.style.left = `${this.shipPos.x}px`;
    this.ship.style.top = `${this.shipPos.y}px`;
    this.ship.style.transform = `translate(-100%, 0) rotate(${angle}rad)`;
    this.mouse.lerp(this.target,0.08);
    // Faster transition speed
    this.bleed.lerp(this.bleedTarget,0.5);
    this.uniforms.u_mouse.value=this.mouse;
    this.uniforms.u_bleed.value=this.bleed;
    this.uniforms.u_intensity.value=this.intensity;
    this.drawTrail();
    this.renderer.render(this.scene,this.camera);
    requestAnimationFrame(()=>this.loop());
}
}
new App();
</script>
</body>
</html>
