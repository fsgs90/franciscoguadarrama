<style>
:root{
--bg:#0B0E14;
--text:#d1cdaf;
--accent:#b2f49f;
--card:#111827;
--font-header:"Press Start 2P", monospace;
--font-body:"JetBrains Mono", monospace;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:var(--font-body);
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* --- STARFIELD LAYERS --- */
.star-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
/* Background Depth */
.stars-bg { z-index: -10; }
/* Foreground Depth (Passing over content) */
.stars-fg { z-index: 10; }

.stars-small { width: 1.5px; height: 1.5px; opacity: 0.8; box-shadow: 2vw 5vh #FFF, 22vw 38vh #FFF, 48vw 72vh #FFF, 75vw 42vh #FFF, 95vw 90vh #FFF, 12vw 88vh #FFF; }
.stars-medium { width: 2px; height: 2px; opacity: 0.9; box-shadow: 10vw 10vh #FFF, 40vw 40vh #FFF, 70vw 70vh #FFF, 25vw 75vh #FFF; }
.stars-large { width: 6px; height: 6px; opacity: 0.3; filter: blur(2px); box-shadow: 15vw 55vh #FFF, 75vw 85vh #FFF, 30vw 10vh #FFF; }

/* CRT SYSTEM OVERLAY */
body::before {
    content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 2000; background-size: 100% 3px, 3px 100%; pointer-events: none;
}

body::after {
    content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
    background: rgba(18, 16, 16, 0.1); opacity: 0; z-index: 2000; pointer-events: none;
    animation: flicker 0.15s infinite;
}

@keyframes flicker { 0% { opacity: 0.1; } 100% { opacity: 0.15; } }

#webgl, #trailCanvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

#saber {
    position: fixed; width: 96px; height: 96px; pointer-events: none;
    z-index: 100; transform-origin: top right; image-rendering: pixelated;
    filter: grayscale(1); /* ADD THIS — converts saber to luminance map */
}

nav{
position:fixed; width:100%; display:flex; justify-content:space-between; align-items:center;
padding:1.2rem; background:rgba(5,8,16,0.8); backdrop-filter:blur(10px); z-index:1000;
}

.nav-links{ display:flex; gap:2rem; }
nav a{ font-family:var(--font-header); font-size:.65rem; color:var(--text); opacity:.5; cursor:pointer; text-decoration:none; }
nav a.active, nav a:hover{ color:var(--accent); opacity:1; }

.sfx-toggle{
font-family:var(--font-header); font-size:.65rem; color:var(--text); opacity:.5;
cursor:pointer; text-decoration:none; border:1px solid rgba(56,189,248,0.3);
background:rgba(17,24,39,0.5); padding:.6rem .9rem; border-radius:4px; margin-left:1rem;
}

.page{ display:none; min-height:100vh; padding-top:120px; position: relative; z-index: 5; }
.page.active{display:block}
.hero{ height:40vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.hero h1{ font-family:var(--font-header); font-size:clamp(1.2rem,4vw,2.5rem); }
.hero p{ color:var(--accent); letter-spacing:2px; }

.reel { max-width: 1000px; margin: 3rem auto; padding: 0 2rem; text-align: center; }
.reel h2 { font-family: var(--font-header); font-size: 0.7rem; letter-spacing: 2px; opacity: 0.5; margin-bottom: 1.5rem; }
.reel-player { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 1px solid rgba(56,189,248,0.2); background: #000; transition: 0.3s; }
.reel-player iframe { width: 100%; height: 100%; }

.filter-wrap{ margin-top:20px; display:flex; gap:10px; }
.filter{ font-family:var(--font-header); font-size:.55rem; padding:.6rem .9rem; border:1px solid rgba(56,189,248,0.3); background:rgba(17,24,39,0.5); color:var(--text); cursor:pointer; }
.filter.active{ background:var(--accent); color:#000; }

.container{ max-width:1000px; margin:auto; padding:2rem; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:2rem; }
.card{ background:var(--card); border-radius:6px; overflow:hidden; position:relative; cursor:pointer; border:1px solid rgba(255,255,255,0.05); transition:.3s; }
.card:hover{ transform:translateY(-6px); border-color:var(--accent); }
.card.featured{grid-column:1/3;height:380px}
.image{ height:75%; position:relative; }
.image img{ width:100%; height:100%; object-fit:cover; opacity:.7; transition:.5s; }
.image iframe { width: 100%; height: 100%; border: none; pointer-events: auto; }
.image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); pointer-events: none; z-index: 4; }
.info{ padding:1.2rem; position:relative; z-index:5; }
.info h3{ font-family:var(--font-header); font-size:.75rem; margin:0; text-shadow:0 0 10px rgba(0,0,0,0.9); }

.modal{ position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:2001; }
.modal.active{display:flex}
.modal-box{ background:#0b1220; padding:2rem; border:1px solid var(--accent); width:min(700px,90vw); border-radius:8px; }

/* --- FOOTER --- */
footer {
    text-align: center;
    padding: 4rem;
    font-size: 0.6rem;
    font-family: var(--font-header);
    opacity: 0.6; /* keep subtle but not too low */
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.footer-links a {
    color: #38bdf8 !important;   /* force bright white */
    opacity: 1 !important;       /* kill inherited fading */
    text-decoration: none;
}

#colorControls {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* PALETTE SWATCH BUTTONS
   Split diagonal shows bg + accent at a glance */
#palette-swatches button {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
#palette-swatches button:hover    { transform: scale(1.2); }
#palette-swatches button.active   { border-color: var(--accent); }

.swatch {
    width: 16px;
    height: 16px;
    border-radius: 50%;  /* circle */
    border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer;
    padding: 0;
}

#colorPicker {
    width: 28px;
    height: 28px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    background: none;
    cursor: pointer;
    padding: 0;
}



</style>
</head>

<script>

  "amber":    { "--bg": "#0D0A05", "--text": "#EDE0C4", "--accent": "#FFB347", "--card": "#1A1200" },

// Example usage: applyPalette("amber") will switch to the amber theme

small:{title:"Energy Field System",img:"https://cdna.artstation.com/p/assets/images/images/085/332/502/original/francisco-guadarrama-2025-02-2518-31-25-ezgif-com-resize.gif?1740537325"}
},
tools:{
featured:{title:"Maya Pipeline Validator",img:"https://i.imgur.com/pptNLiB.gif"},
mid:{title:"Low Poly Tool",img:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnVtODY5eDZ6YjY4NHA0NGd4bDc1dG9lbGk4YzQ1Mjc2bWc1NmFydiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/YfIqRqgD6HxsPTIwfg/giphy.gif"},
small:{title:"Workflow Tool",img:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnVtODY5eDZ6YjY4NHA0NGd4bDc1dG9lbGk4YzQ1Mjc2bWc1NmFydiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/YfIqRqgD6HxsPTIwfg/giphy.gif"}

// [BLACK BOX: APPLICATION LOGIC UNCHANGED]
class App{
constructor(){
this.saber = document.getElementById("saber");
// Store as 0-255 integers because rgba() strings need that range
this.saberColor = { r: 34, g: 197, b: 94 }; // default green
this.saberPos = { x: innerWidth/2, y: innerHeight/2 };
this.saberTarget = { x: this.saberPos.x, y: this.saberPos.y };
this.audioCtx = null; this.isSfxMuted = true; this.velocity = 0; this.lastMousePos = { x: 0, y: 0 };
this.trailCanvas = document.getElementById("trailCanvas");
this.trailCtx = this.trailCanvas.getContext("2d");
this.trailPoints = []; this.grid=document.getElementById("grid");
this.modal=document.getElementById("modal"); this.modalTitle=document.getElementById("modalTitle");
this.modalImg=document.getElementById("modalImg"); this.mouse=new THREE.Vector2(.5,.5);
this.target=new THREE.Vector2(.5,.5); this.bleed=new THREE.Vector4();
this.caBase = 0.0; // ADD THIS — base value for chromatic aberration, toggled by CA button
this.bleedTarget=new THREE.Vector4(); this.intensity=0; this.caTarget = 0.0;  // Target for chromatic aberration
this.init();
}
init(){ this.initGL(); this.initResize(); this.setupTrail(); this.nav(); this.render("reel"); this.loop(); this.setColor(0.2, 1.0, 0.3); }
initResize(){ window.addEventListener("resize",()=>this.onResize()); }
onResize(){
    this.renderer.setSize(innerWidth, innerHeight);
    this.uniforms.u_res.value.set(innerWidth, innerHeight);
    this.trailCanvas.width = innerWidth; this.trailCanvas.height = innerHeight;
}
initGL(){
    
this.renderer=new THREE.WebGLRenderer({canvas:document.getElementById("webgl"),alpha:true});
this.renderer.setSize(innerWidth,innerHeight);
this.scene=new THREE.Scene(); this.camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
this.uniforms={ u_mouse:{value:this.mouse}, u_bleed:{value:this.bleed}, u_intensity:{value:0}, u_res:{value:new THREE.Vector2(innerWidth,innerHeight)}, u_color:{value:new THREE.Vector3(0.2, 1.0, 0.3)}, u_ca:{value:0.0}}; //0 off 1 on for chromatic aberration
const mat=new THREE.ShaderMaterial({
uniforms:this.uniforms,
vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,
fragmentShader:`
precision highp float;
varying vec2 vUv; uniform vec2 u_mouse; uniform vec4 u_bleed; uniform float u_intensity; uniform vec2 u_res; uniform vec3 u_color; uniform float u_ca;
void main(){
    vec2 uv = vUv;
    float aspect = u_res.x / u_res.y;

    /* --- GLOW: proximity to mouse cursor --- */
    float d = distance(uv * vec2(aspect,1.), u_mouse * vec2(aspect,1.));
    float glow = 0.04 / (d + 0.04);

    /* --- EDGE: highlight hovered UI elements --- */
    float edge = smoothstep(.03,0., abs(uv.x-(u_bleed.x+u_bleed.z*.5))-u_bleed.z*.5)
               * smoothstep(.15,0., abs(uv.y-(u_bleed.y+u_bleed.w*.5))-u_bleed.w*.5);

    /* --- BASE INTENSITY: combined glow + edge --- */
    float base = glow + (edge * u_intensity * 0.2);

    /* --- CHROMATIC ABERRATION: offset R and B channels horizontally ---
       u_ca=0 means aberration=0, no effect. u_ca=1 shifts channels apart. */
    float aberration = 0.07 * u_ca;
    float rGlow = 0.04 / (distance((uv + vec2(aberration, 0.0)) * vec2(aspect,1.), u_mouse * vec2(aspect,1.)) + 0.04);
    float bGlow = 0.04 / (distance((uv - vec2(aberration, 0.0)) * vec2(aspect,1.), u_mouse * vec2(aspect,1.)) + 0.04);

    /* --- FINAL COLOR: tint each channel, R and B are offset when CA is on --- */
    vec3 col = vec3(
        u_color.r * (rGlow + edge * u_intensity * 0.2),
        u_color.g * base,
        u_color.b * (bGlow + edge * u_intensity * 0.2)
    );

    gl_FragColor = vec4(col, (glow + edge) * 0.5);
}`
});
this.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
}
nav() {
    gsap.registerPlugin(ScrollToPlugin);
    document.querySelectorAll("nav a").forEach(a => {
        a.onclick = () => {
            const pid = a.dataset.page;
            document.querySelectorAll("nav a").forEach(l => l.classList.remove("active"));
            a.classList.add("active");
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            document.getElementById(pid).classList.add("active");
            if(pid === "home") gsap.to(window, {duration: 1, scrollTo: 0});
        };
    });

    // 1. DEDICATED LISTENER FOR PALETTE SWATCHES
    document.querySelectorAll('#palette-swatches button').forEach(btn => {
        btn.onclick = () => {
            const paletteName = btn.dataset.palette;
            
            // Call the global function without "this."
            applyPalette(paletteName); 
            
            // Optional: Visually highlight the selected palette button
            document.querySelectorAll('#palette-swatches button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };
    });

    // 2. LISTENER FOR SPECIFIC RGB SWATCHES
    document.querySelectorAll('.swatch').forEach(btn => {
        btn.onclick = () => {
            const [r,g,b] = btn.dataset.color.split(',').map(Number);
            this.setSaberColor(r, g, b);
            this.setShaderColor(r, g, b);
        };
    });

    // Color picker — convert hex to normalized float
    document.getElementById('colorPicker').oninput = (e) => {
        const { r, g, b } = this.hexToVec3(e.target.value);
        this.setColor(r, g, b);
    };

    // CA toggle → flip u_ca uniform between 0 and 1
    document.getElementById('caToggle').onclick = () => {
        const isOn = this.caBase === 1.0;
        this.caBase = isOn ? 0.0 : 1.0;  // flip the base
        this.caTarget = 0.0;              // reset on toggle off
        document.getElementById('caToggle').textContent = isOn ? 'CA:OFF' : 'CA:ON';
    };

    document.querySelectorAll("nav a, .sfx-toggle, .filter").forEach(el => {
        el.addEventListener('mouseenter', () => {
            const r = el.getBoundingClientRect();
            this.bleedTarget.set(r.left / innerWidth, 1 - r.bottom / innerHeight, r.width / innerWidth, r.height / innerHeight);
            this.intensity = 0.7; 
            this.caTarget = this.caBase;
        });
        el.addEventListener('mouseleave', () => {
            this.intensity = 0;
            this.caTarget = 0.0; 
        });
    });

    window.onmousemove = (e) => {
        const dx = e.clientX - this.lastMousePos.x; const dy = e.clientY - this.lastMousePos.y;
        this.velocity += (Math.sqrt(dx*dx + dy*dy) - this.velocity) * 0.15;
        this.lastMousePos = { x: e.clientX, y: e.clientY };
        this.addTrailPoint(this.saberPos.x, this.saberPos.y);
        this.target.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
        this.saberTarget.x = e.clientX; this.saberTarget.y = e.clientY;
    };

    document.getElementById("sfxToggle").onclick = () => this.toggleSfx();
    
    document.querySelectorAll(".filter").forEach(b => {
        b.onclick = () => {
            document.querySelectorAll(".filter").forEach(x => x.classList.remove("active"));
            b.classList.add("active"); this.render(b.dataset.filter);
        };
    });
}
toggleSfx(){
    if (!this.audioCtx) {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        this.audioEl = document.getElementById("ambience");
        const source = this.audioCtx.createMediaElementSource(this.audioEl);
        this.gainNode = this.audioCtx.createGain(); this.filterNode = this.audioCtx.createBiquadFilter();
        this.filterNode.type = 'lowpass'; source.connect(this.filterNode).connect(this.gainNode).connect(this.audioCtx.destination);
    }
    this.isSfxMuted = !this.isSfxMuted;
    if(this.isSfxMuted){ this.audioEl.pause(); document.getElementById("sfxToggle").textContent = "🔇"; }
    else{ this.audioEl.play(); document.getElementById("sfxToggle").textContent = "🔈"; }
}
// Utility: converts hex string → normalized vec3 values
// e.g. "#b2f49f" → { r: 0.698, g: 0.957, b: 0.624 }
hexToVec3(hex) {
    const r = parseInt(hex.slice(1,3), 16) / 255;
    const g = parseInt(hex.slice(3,5), 16) / 255;
    const b = parseInt(hex.slice(5,7), 16) / 255;
    return { r, g, b };
}
// Single source of truth — everything routes through here
setColor(r, g, b) {
    this.uniforms.u_color.value.set(r, g, b);

    this.saberColor = {
        r: Math.round(r * 255),
        g: Math.round(g * 255),
        b: Math.round(b * 255)
    };

    // Convert RGB to proper HSL hue in degrees
    // Math.max/min find the dominant and weakest channel
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const delta = max - min;

    let hue = 0;
    if (delta !== 0) {
        if      (max === r) hue = ((g - b) / delta) % 6;       // red is dominant
        else if (max === g) hue = ((b - r) / delta) + 2;       // green is dominant
        else                hue = ((r - g) / delta) + 4;       // blue is dominant
    }
    hue = Math.round(hue * 60); // convert to degrees
    if (hue < 0) hue += 360;   // keep positive

    // Subtract 37 because sepia() starts at ~37deg, not 0
    this.saber.style.filter = `grayscale(1) sepia(1) hue-rotate(${hue - 37}deg) saturate(3)`;
}
/* Controls saber GIF + trail only — called by green/red swatches */
setSaberColor(r, g, b) {
    // Store as 0-255 for canvas rgba() strings
    this.saberColor = {
        r: Math.round(r * 255),
        g: Math.round(g * 255),
        b: Math.round(b * 255)
    };
    // Apply CSS filter tint to greyscale GIF
    const max = Math.max(r,g,b), min = Math.min(r,g,b), delta = max - min;
    let hue = 0;
    if(delta !== 0){
        if(max===r)      hue = ((g-b)/delta) % 6;
        else if(max===g) hue = ((b-r)/delta) + 2;
        else             hue = ((r-g)/delta) + 4;
    }
    hue = Math.round(hue * 60);
    if(hue < 0) hue += 360;
    this.saber.style.filter = `grayscale(1) sepia(1) hue-rotate(${hue - 37}deg) saturate(3)`;
}

/* Controls WebGL shader glow only — called by color picker */
setShaderColor(r, g, b) {
    this.uniforms.u_color.value.set(r, g, b);
}

setupTrail(){ this.onResize(); }
addTrailPoint(x,y){
    this.trailPoints.push({x,y,t:Date.now()});
    if(this.trailPoints.length > 150) this.trailPoints.shift();
}
drawTrail() {
    const now = Date.now(); const ctx = this.trailCtx;
    ctx.clearRect(0, 0, this.trailCanvas.width, this.trailCanvas.height);
    ctx.lineCap = "round"; ctx.lineJoin = "round";

    // --- GLOW PASS (wide, soft, composite blending) ---
    ctx.globalCompositeOperation = 'screen'; 
    ctx.shadowBlur = 20; 
    ctx.shadowColor = `rgba(${this.saberColor.r},${this.saberColor.g},${this.saberColor.b},0.4)`;  // was hardcoded green

    for (let i = 1; i < this.trailPoints.length; i++) {
        const current = this.trailPoints[i]; const previous = this.trailPoints[i-1];
        const age = (now - current.t) / 3000; const alpha = Math.max(0, 1 - age); if (alpha <= 0) continue;
        ctx.lineWidth = 14; 
        ctx.strokeStyle = `rgba(${this.saberColor.r},${this.saberColor.g},${this.saberColor.b},${alpha * 0.12})`;  // was hardcoded green
        ctx.beginPath(); ctx.moveTo(previous.x, previous.y); ctx.lineTo(current.x, current.y); ctx.stroke();
    }

    // --- CORE PASS (sharp, bright, hot center) ---
    // Mix toward white by adding 60 to each channel, clamped at 255
    const hr = Math.min(255, this.saberColor.r + 60);
    const hg = Math.min(255, this.saberColor.g + 60);
    const hb = Math.min(255, this.saberColor.b + 60);

    ctx.globalCompositeOperation = 'source-over'; 
    ctx.shadowBlur = 8; 
    ctx.shadowColor = `rgba(${hr},${hg},${hb},0.5)`;  // was hardcoded light green
    
    for (let i = 1; i < this.trailPoints.length; i++) {
        const current = this.trailPoints[i]; const previous = this.trailPoints[i-1];
        const age = (now - current.t) / 700; const alpha = Math.max(0, 1 - age); if (alpha <= 0) continue;
        ctx.lineWidth = 6 * alpha + 1; 
        ctx.strokeStyle = `rgba(${hr},${hg},${hb},${alpha * 0.9})`;  // was hardcoded near-white green
        ctx.beginPath(); ctx.moveTo(previous.x, previous.y); ctx.lineTo(current.x, current.y); ctx.stroke();
    }
}
card(d, t) {
    if (!d) return document.createDocumentFragment(); // Return nothing if data is missing
    const c = document.createElement("div"); 
    c.className = `card ${t}`;
    
    const visual = d.embed 
        ? `<div class="image">${d.embed}</div>` 
        : `<div class="image"><img src="${d.img || ''}"></div>`;
        
    c.innerHTML = `${visual}<div class="info"><h3>${d.title || 'Untitled'}</h3></div>`;
    
    // Fix for Error 153/Iframe interaction
    const iframe = c.querySelector('iframe');
    if(iframe) {
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    }

   c.onmouseenter = () => {
    const r = c.getBoundingClientRect();
    this.bleedTarget.set(r.left/innerWidth, 1-r.bottom/innerHeight, r.width/innerWidth, r.height/innerHeight);
    this.intensity = 1.2;
    this.caTarget = this.caBase;  // only fires if toggle is ON, was hardcoded 1.0
    };
   c.onmouseleave = () => {
        this.intensity = 0;
        this.caTarget = 0.0;  // ADD THIS — fades out on leave
    };
    return c;
}

render(t){
    const d = PROJECTS[t]; 
    if (!d) return; // Safety check
    this.grid.innerHTML = "";
    
    // Only append if the sub-item actually exists
    if (d.featured) this.grid.appendChild(this.card(d.featured, "featured"));
    if (d.mid) this.grid.appendChild(this.card(d.mid, "mid")); 
    if (d.small) this.grid.appendChild(this.card(d.small, "small"));
}
loop(){
    // --- AUDIO: modulate gain and filter cutoff with mouse velocity ---
    if (!this.isSfxMuted && this.gainNode) {
        this.gainNode.gain.setTargetAtTime(0.15 + (this.velocity/120), this.audioCtx.currentTime, 0.1);
        this.filterNode.frequency.setTargetAtTime(450 + (this.velocity * 15), this.audioCtx.currentTime, 0.1);
    }

    // --- SABER: smooth follow + rotation toward target ---
    this.velocity *= 0.95;
    this.saberPos.x += (this.saberTarget.x - this.saberPos.x) * 0.08;
    this.saberPos.y += (this.saberTarget.y - this.saberPos.y) * 0.08;
    const angle = Math.atan2(this.saberTarget.y - this.saberPos.y, this.saberTarget.x - this.saberPos.x);
    this.saber.style.left = `${this.saberPos.x}px`;
    this.saber.style.top = `${this.saberPos.y}px`;
    this.saber.style.transform = `translate(-100%, 0) rotate(${angle}rad)`;

    // --- SHADER UNIFORMS: lerp all values toward their targets ---
    this.mouse.lerp(this.target, 0.08);
    this.bleed.lerp(this.bleedTarget, 0.5);
    this.uniforms.u_ca.value += (this.caTarget - this.uniforms.u_ca.value) * 0.1; // ONE lerp only
    this.uniforms.u_mouse.value = this.mouse;
    this.uniforms.u_bleed.value = this.bleed;
    this.uniforms.u_intensity.value = this.intensity;

    // --- DRAW ---
    this.drawTrail();
    this.renderer.render(this.scene, this.camera);
    requestAnimationFrame(()=>this.loop());
};
}

// --- [PARALLAX ENGINE] ---
const starLayers = [
    { el1: document.getElementById('s1'), el2: document.getElementById('s2'), pos: 0, speed: 1.5, f: 0.8 },
    { el1: document.getElementById('m1'), el2: document.getElementById('m2'), pos: 0, speed: 0.8, f: 0.4 },
    { el1: document.getElementById('l1'), el2: document.getElementById('l2'), pos: 0, speed: 2.5, f: 1.2 } // High speed foreground
];
let scrollV = 0, lastS = 0, vh = window.innerHeight;
starLayers.forEach(l => l.el2.style.transform = `translate3d(0, ${vh}px, 0)`);

function animateStars() {
    scrollV *= 0.94;
    starLayers.forEach(l => {
        l.pos -= (l.speed + (scrollV * l.f));
        if (l.pos <= -vh) l.pos += vh; if (l.pos >= 0) l.pos -= vh;
        l.el1.style.transform = `translate3d(0, ${l.pos}px, 0)`;
        l.el2.style.transform = `translate3d(0, ${l.pos + vh}px, 0)`;
    });
    requestAnimationFrame(animateStars);
}

window.addEventListener('scroll', () => {
    let st = window.pageYOffset;
    scrollV = st - lastS; lastS = st;
});

// APPLY PALETTE
// Writing variables to :root (documentElement) causes every
// CSS rule using var(--accent), var(--bg) etc. to update instantly
function applyPalette(name) {
    const p = PALETTES[name];
    if (!p) return;

    // 1. Update CSS Variables (Fonts/Backgrounds)
    Object.entries(p).forEach(([variable, value]) => {
        document.documentElement.style.setProperty(variable, value);
    });

    // 2. Sync the Saber/Shader colors
    // We access the global 'window.app' instance (see step 2 below)
    if (window.app) {
        const hex = p["--accent"];
        const { r, g, b } = window.app.hexToVec3(hex);
        window.app.setColor(r, g, b);
        
        // Also update the color picker UI so it matches
        document.getElementById('colorPicker').value = hex;
    }

    localStorage.setItem("palette", name);
}

// START SYSTEMS
window.app = new App();
// VFX Layer (stars) is separate from App because it doesn't need WebGL, audio, or project data — keeps it lightweight
animateStars();
