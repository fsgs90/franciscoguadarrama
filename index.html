<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francisco Guadarrama | Tech Art & Combat</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<style>
:root{ --bg:#050810; --accent:#38bdf8; --font-header:"Press Start 2P", monospace; }
body{ margin:0; background:var(--bg); overflow-x:hidden; cursor:crosshair; color: #fff; min-height: 500vh; }

/* 1. STARFIELD LAYER (FURTHEST BACKGROUND) */
.star-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -10; }
.stars-small { width: 1.5px; height: 1.5px; opacity: 0.8; box-shadow: 2vw 5vh #FFF, 22vw 38vh #FFF, 48vw 72vh #FFF, 75vw 42vh #FFF, 95vw 90vh #FFF, 12vw 88vh #FFF; }
.stars-medium { width: 2px; height: 2px; opacity: 0.9; box-shadow: 10vw 10vh #FFF, 40vw 40vh #FFF, 70vw 70vh #FFF, 25vw 75vh #FFF; }
.stars-large { width: 5px; height: 5px; opacity: 0.4; filter: blur(1.5px); box-shadow: 15vw 55vh #FFF, 75vw 85vh #FFF, 30vw 10vh #FFF; }

/* 2. WEBGL & TRAILS (ABOVE STARS, BELOW CONTENT) */
#webgl, #trailCanvas { position:fixed; inset:0; z-index: 1; pointer-events:none; }

/* 3. COMBAT ENTITIES (Z-INDEX 90-95) */
.droid { position: fixed; width: 40px; height: 40px; background: radial-gradient(circle at 30% 30%, #444, #111); border: 2px solid #333; border-radius: 50%; z-index: 90; }
.laser { position: fixed; width: 24px; height: 4px; background: #ff3300; border-radius: 2px; z-index: 95; box-shadow: 0 0 10px #f00; }

/* 4. SHIP (ON TOP) */
#ship { position: fixed; width: 96px; height: 96px; pointer-events: none; z-index: 100; transform-origin: center right; image-rendering: pixelated; }

#ui { position: fixed; top: 20px; left: 20px; color: var(--accent); font-family: var(--font-header); font-size: 0.7rem; z-index: 2001; }
#overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
    display: flex; align-items: center; justify-content: center; 
    z-index: 3000; font-family: var(--font-header); color: var(--accent);
    cursor: pointer; text-align: center; line-height: 2;
}

/* CONTENT SPACING FOR SCROLLING */
.content-placeholder {
    position: relative;
    z-index: 5;
    padding: 100px 50px;
    font-family: var(--font-header);
    pointer-events: none;
}
</style>
</head>
<body>

<div id="s1" class="star-layer stars-small"></div>
<div id="s2" class="star-layer stars-small"></div>
<div id="m1" class="star-layer stars-medium"></div>
<div id="m2" class="star-layer stars-medium"></div>
<div id="l1" class="star-layer stars-large"></div>
<div id="l2" class="star-layer stars-large"></div>

<div id="overlay">INITIALIZING COMBAT PROTOCOL...<br>[ CLICK TO ENGAGE AUDIO ]</div>
<div id="ui">SCORE: <span id="score">0</span></div>

<canvas id="webgl"></canvas>
<canvas id="trailCanvas"></canvas>
<img id="ship" src="assets/art/base_saber_anim.gif"/>

<div class="content-placeholder">
    <h1>SCROLL TO SEE PARALLAX</h1>
    <p>COMBAT SYSTEMS ACTIVE</p>
</div>

<script>
// --- [BLACK BOX: SYNTH ENGINE] ---
class SynthEngine {
    constructor() { this.initialized = false; }
    init() {
        if (this.initialized) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
        this.setupHum();
        this.initialized = true;
    }
    setupHum() {
        this.osc1 = this.ctx.createOscillator();
        this.osc2 = this.ctx.createOscillator();
        this.humGain = this.ctx.createGain();
        this.filter = this.ctx.createBiquadFilter();
        this.osc1.type = 'sawtooth'; this.osc1.frequency.value = 50; 
        this.osc2.type = 'sine'; this.osc2.frequency.value = 100;
        this.filter.type = 'lowpass'; this.filter.frequency.value = 400;
        this.humGain.gain.value = 0.2;
        this.osc1.connect(this.filter); this.osc2.connect(this.filter);
        this.filter.connect(this.humGain); this.humGain.connect(this.master);
        this.osc1.start(); this.osc2.start();
    }
    updateHum(vel) {
        if (!this.initialized) return;
        const speed = Math.min(vel / 40, 1);
        this.filter.frequency.setTargetAtTime(300 + (speed * 1500), this.ctx.currentTime, 0.1);
        this.osc1.frequency.setTargetAtTime(50 + (speed * 20), this.ctx.currentTime, 0.1);
        this.humGain.gain.setTargetAtTime(0.15 + (speed * 0.2), this.ctx.currentTime, 0.1);
    }
    playLaser() {
        if (!this.initialized) return;
        const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(1600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.2);
        g.gain.setValueAtTime(0.2, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
        osc.connect(g).connect(this.master); osc.start(); osc.stop(this.ctx.currentTime + 0.2);
    }
    playClash() {
        if (!this.initialized) return;
        const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.05);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.08);
        osc.connect(g).connect(this.master); osc.start(); osc.stop(this.ctx.currentTime + 0.08);
    }
}

// --- [BLACK BOX: COMBAT APP] ---
class App {
    constructor() {
        this.ship = document.getElementById("ship");
        this.shipPos = { x: innerWidth/2, y: innerHeight/2 };
        this.shipTarget = { x: innerWidth/2, y: innerHeight/2 };
        this.velocity = 0; this.lastMousePos = { x: 0, y: 0 };
        this.score = 0; this.trailPoints = []; this.droids = []; this.lasers = [];
        this.laserData = Array.from({ length: 10 }, () => new THREE.Vector2(-1, -1));
        this.synth = new SynthEngine();
        this.init();
    }

    init() {
        this.initGL();
        this.trailCanvas = document.getElementById("trailCanvas");
        this.trailCtx = this.trailCanvas.getContext("2d");
        this.onResize();
        window.addEventListener("resize", () => this.onResize());
        document.getElementById('overlay').onclick = () => {
            this.synth.init();
            document.getElementById('overlay').style.display = 'none';
        };
        window.addEventListener("mousemove", (e) => {
            this.velocity = Math.hypot(e.clientX - this.lastMousePos.x, e.clientY - this.lastMousePos.y);
            this.lastMousePos = { x: e.clientX, y: e.clientY };
            this.shipTarget.x = e.clientX; this.shipTarget.y = e.clientY;
        });
        this.spawnDroid();
        this.loop();
    }

    onResize() {
        this.renderer.setSize(innerWidth, innerHeight);
        this.trailCanvas.width = innerWidth; this.trailCanvas.height = innerHeight;
    }

    initGL() {
        this.renderer = new THREE.WebGLRenderer({canvas: document.getElementById("webgl"), alpha: true});
        this.scene = new THREE.Scene();
        this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.uniforms = {
            u_mouse: { value: new THREE.Vector2() },
            u_lasers: { value: this.laserData },
            u_laserCount: { value: 0 },
            u_res: { value: new THREE.Vector2(innerWidth, innerHeight) }
        };
        const mat = new THREE.ShaderMaterial({
            uniforms: this.uniforms,
            vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
            fragmentShader: `
                precision highp float;
                varying vec2 vUv;
                uniform vec2 u_mouse;
                uniform vec2 u_lasers[10];
                uniform int u_laserCount;
                uniform vec2 u_res;
                void main(){
                    vec2 uv = vUv;
                    float aspect = u_res.x/u_res.y;
                    vec2 aspectUv = uv * vec2(aspect, 1.0);
                    float d = distance(aspectUv, u_mouse * vec2(aspect, 1.0));
                    float glow = 0.04 / (d + 0.04);
                    vec3 col = vec3(0.2, 1.0, 0.4) * glow;
                    for(int i=0; i<10; i++){
                        if(i >= u_laserCount) break;
                        float ld = distance(aspectUv, u_lasers[i] * vec2(aspect, 1.0));
                        col += vec3(1.0, 0.2, 0.0) * (0.02 / (ld + 0.02));
                    }
                    gl_FragColor = vec4(col, glow * 0.6);
                }`
        });
        this.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));
    }

    spawnDroid() {
        if(this.droids.length > 0) return;
        const d = { x: Math.random() * innerWidth, y: Math.random() * innerHeight, vx: 0, vy: 0, lastFire: Date.now() + 1000, el: document.createElement('div') };
        d.el.className = 'droid'; document.body.appendChild(d.el); this.droids.push(d);
    }

    drawTrail(sAngle) {
        const tipX = this.shipPos.x - Math.cos(sAngle) * 85;
        const tipY = this.shipPos.y - Math.sin(sAngle) * 85;
        this.trailPoints.push({ x: tipX, y: tipY });
        if(this.trailPoints.length > 20) this.trailPoints.shift();
        this.trailCtx.clearRect(0,0, innerWidth, innerHeight);
        if(this.trailPoints.length < 2) return;
        this.trailCtx.beginPath();
        this.trailCtx.strokeStyle = '#aaffaa'; this.trailCtx.lineWidth = 12;
        this.trailCtx.lineCap = 'round'; this.trailCtx.shadowBlur = 20; this.trailCtx.shadowColor = '#38bdf8';
        for(let i=0; i<this.trailPoints.length-1; i++) {
            this.trailCtx.globalAlpha = i / this.trailPoints.length;
            this.trailCtx.moveTo(this.trailPoints[i].x, this.trailPoints[i].y);
            this.trailCtx.lineTo(this.trailPoints[i+1].x, this.trailPoints[i+1].y);
        }
        this.trailCtx.stroke();
    }

    loop() {
        this.shipPos.x += (this.shipTarget.x - this.shipPos.x) * 0.15;
        this.shipPos.y += (this.shipTarget.y - this.shipPos.y) * 0.15;
        const sAngle = Math.atan2(this.shipTarget.y - this.shipPos.y, this.shipTarget.x - this.shipPos.x);
        this.ship.style.left = `${this.shipPos.x}px`; this.ship.style.top = `${this.shipPos.y}px`;
        this.ship.style.transform = `translate(-100%, -50%) rotate(${sAngle}rad)`;
        this.uniforms.u_mouse.value.set(this.shipPos.x / innerWidth, 1 - this.shipPos.y / innerHeight);
        this.synth.updateHum(this.velocity);
        this.drawTrail(sAngle);

        let lCount = 0;
        this.lasers.forEach((l, idx) => {
            l.x += l.vx; l.y += l.vy; l.el.style.left = `${l.x}px`; l.el.style.top = `${l.y}px`;
            if(lCount < 10) this.laserData[lCount++].set(l.x / innerWidth, 1 - l.y / innerHeight);
            if(Math.hypot(l.x - this.shipPos.x, l.y - this.shipPos.y) < 65 && !l.bounced) {
                l.bounced = true; this.synth.playClash();
                const nx = Math.cos(sAngle + Math.PI/2), ny = Math.sin(sAngle + Math.PI/2);
                const dot = l.vx * nx + l.vy * ny; l.vx -= 2 * dot * nx; l.vy -= 2 * dot * ny;
            }
            if(l.x < -50 || l.x > innerWidth+50 || l.y < -50 || l.y > innerHeight+50) { l.el.remove(); this.lasers.splice(idx, 1); }
        });
        this.uniforms.u_laserCount.value = lCount;

        this.droids.forEach((d, idx) => {
            const dist = Math.hypot(d.x - this.shipPos.x, d.y - this.shipPos.y);
            const angle = Math.atan2(this.shipPos.y-d.y, this.shipPos.x-d.x);
            let ax = Math.cos(angle) * (dist-320) * 0.002; let ay = Math.sin(angle) * (dist-320) * 0.002;
            ax += Math.cos(angle + Math.PI/2) * 0.2; ay += Math.sin(angle + Math.PI/2) * 0.2;
            d.vx = (d.vx + ax) * 0.95; d.vy = (d.vy + ay) * 0.95; d.x += d.vx; d.y += d.vy;
            d.el.style.left = `${d.x}px`; d.el.style.top = `${d.y}px`;
            if(Date.now() - d.lastFire > 2200) {
                const fAngle = Math.atan2(this.shipPos.y - d.y, this.shipPos.x - d.x);
                const el = document.createElement('div'); el.className = 'laser'; document.body.appendChild(el);
                this.lasers.push({ x: d.x+20, y: d.y+20, vx: Math.cos(fAngle)*9, vy: Math.sin(fAngle)*9, el, bounced: false });
                this.synth.playLaser(); d.lastFire = Date.now();
            }
            if(dist < 60 && this.velocity > 15) {
                this.synth.playClash(); d.el.remove(); this.droids.splice(idx, 1);
                this.score++; document.getElementById('score').innerText = this.score;
                setTimeout(() => this.spawnDroid(), 1500);
            }
        });

        this.renderer.render(this.scene, this.camera);
        requestAnimationFrame(() => this.loop());
    }
}

// --- [PARALLAX ENGINE] ---
const starLayers = [
    { el1: document.getElementById('s1'), el2: document.getElementById('s2'), pos: 0, speed: 1.5, f: 0.8 },
    { el1: document.getElementById('m1'), el2: document.getElementById('m2'), pos: 0, speed: 0.8, f: 0.4 },
    { el1: document.getElementById('l1'), el2: document.getElementById('l2'), pos: 0, speed: 0.3, f: 0.1 }
];
let scrollV = 0, lastS = 0, vh = window.innerHeight;
starLayers.forEach(l => l.el2.style.transform = `translate3d(0, ${vh}px, 0)`);

function animateStars() {
    scrollV *= 0.94; // Inertia
    starLayers.forEach(l => {
        l.pos -= (l.speed + (scrollV * l.f));
        if (l.pos <= -vh) l.pos += vh; if (l.pos >= 0) l.pos -= vh;
        l.el1.style.transform = `translate3d(0, ${l.pos}px, 0)`;
        l.el2.style.transform = `translate3d(0, ${l.pos + vh}px, 0)`;
    });
    requestAnimationFrame(animateStars);
}

window.addEventListener('scroll', () => {
    let st = window.pageYOffset;
    scrollV = st - lastS;
    lastS = st;
});

// START ALL SYSTEMS
new App();
animateStars();
</script>
</body>
</html>
