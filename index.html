<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francisco Guadarrama | Tech Art</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<style>
:root{
--bg:#0B0E14; --text:#d1cdaf; --accent:#b2f49f; --card:#111827;
--font-header:"Press Start 2P", monospace; --font-body:"JetBrains Mono", monospace;
}

*{box-sizing:border-box}
body{ margin:0; font-family:var(--font-body); background:var(--bg); color:var(--text); overflow-x:hidden; cursor: none; }

/* LAYERING SYSTEM */
#webgl, #trailCanvas { position: fixed; inset: 0; pointer-events: none; }
#webgl { z-index: 1; }
#trailCanvas { z-index: 1500; } /* Renders over UI */
#ship { 
    position: fixed; width: 96px; height: 96px; pointer-events: none; 
    z-index: 1600; transform-origin: center right; image-rendering: pixelated; 
}

/* CRT OVERLAY */
body::before {
    content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 2000; background-size: 100% 3px, 3px 100%; pointer-events: none;
}

nav{
position:fixed; width:100%; display:flex; justify-content:space-between; align-items:center;
padding:1.2rem; background:rgba(5,8,16,0.8); backdrop-filter:blur(10px); z-index:1000;
}
.nav-links{ display:flex; gap:2rem; }
nav a{ font-family:var(--font-header); font-size:.65rem; color:var(--text); opacity:.5; cursor:pointer; text-decoration:none; }
nav a.active, nav a:hover{ color:var(--accent); opacity:1; }

.sfx-toggle{
font-family:var(--font-header); font-size:.65rem; color:var(--text); opacity:.5;
cursor:pointer; border:1px solid rgba(178,244,159,0.3);
background:rgba(17,24,39,0.5); padding:.6rem .9rem; border-radius:4px;
}

.page{ display:none; min-height:100vh; padding-top:120px; position: relative; z-index: 5; }
.page.active{display:block}
.hero{ height:40vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.hero h1{ font-family:var(--font-header); font-size:clamp(1.2rem,4vw,2.5rem); }

.reel { max-width: 1000px; margin: 3rem auto; padding: 0 2rem; text-align: center; }
.reel-player { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 1px solid rgba(178,244,159,0.2); background: #000; }
.reel-player iframe { width: 100%; height: 100%; border:none; }

.filter-wrap{ margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.filter{ font-family:var(--font-header); font-size:.55rem; padding:.6rem .9rem; border:1px solid rgba(178,244,159,0.3); background:rgba(17,24,39,0.5); color:var(--text); cursor:pointer; }
.filter.active{ background:var(--accent); color:#000; }

.container{ max-width:1000px; margin:auto; padding:2rem; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:2rem; }
.card{ background:var(--card); border-radius:6px; overflow:hidden; position:relative; cursor:pointer; border:1px solid rgba(255,255,255,0.05); transition:.3s; }
.card.featured{grid-column:1/3;height:380px}
.image{ height:75%; position:relative; overflow:hidden; }
.image img, .image iframe { width:100%; height:100%; object-fit:cover; opacity:.7; border:none; pointer-events:none; }
.info{ padding:1.2rem; }
.info h3{ font-family:var(--font-header); font-size:.75rem; margin:0; }

.modal{ position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:2001; }
.modal.active{display:flex}
</style>
</head>

<body>

<canvas id="webgl"></canvas>
<canvas id="trailCanvas"></canvas>
<audio id="ambience" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto" loop crossorigin="anonymous"></audio>
<img id="ship" src="assets/art/base_saber_anim.gif"/>

<nav>
<button id="sfxToggle" class="sfx-toggle">HUM: OFF</button>
<div class="nav-links">
<a data-page="home" class="active">HOME</a>
<a data-page="resume">RESUME</a>
<a data-page="contact">CONTACT</a>
</div>
</nav>

<div id="home" class="page active">
    <section class="hero">
        <h1>FRANCISCO<br>GUADARRAMA</h1>
        <p>// TECH ARTIST</p>
        <div class="filter-wrap">
            <button class="filter active" data-filter="shaders">SHADERS</button>
            <button class="filter" data-filter="tools">TOOLS</button>
            <button class="filter" data-filter="vfx">VFX</button>
            <button class="filter" data-filter="pixel">PIXEL_ART</button>
            <button class="filter" data-filter="threed">3D</button>
        </div>
    </section>

    <section class="reel">
        <div class="reel-player">
            <iframe src="https://www.youtube.com/embed/pWibE_B-H7w" allowfullscreen></iframe>
        </div>
    </section>

    <div class="container"><div class="grid" id="grid"></div></div>
</div>

<div id="resume" class="page"><div class="hero"><h1>RESUME</h1></div></div>
<div id="contact" class="page"><div class="hero"><h1>CONTACT</h1></div></div>

<script>
const PROJECTS={
    pixel:{
        featured:{title:"2D Dynamic Shadows",img:"https://i.makeagif.com/media/4-26-2026/8c9H56.gif"},
        mid:{title:"Procedural Fire",img:"https://i.makeagif.com/media/4-26-2026/NvAZ5q.gif"},
        small:{title:"Tile Shader",img:"https://i.imgur.com/cwDTOv8.gif"}
    },
    shaders:{
        featured:{title:"3D Pixel Pipeline",img:"https://i.makeagif.com/media/4-26-2026/L1q6OG.gif"},
        mid:{title:"Cross-Hatching",img:"https://media.giphy.com/media/lXiRIV4VyM2sBjvs4/giphy.gif"},
        small:{title:"Water Shader",img:"https://cdnb.artstation.com/p/assets/images/images/014/103/113/original/brendan-sullivan-pixelwatershader1-500.gif?1542479170"}
    },
    vfx:{
        featured:{title:"Ink Explosion",img:"https://cdna.artstation.com/p/assets/images/images/085/444/508/original/francisco-guadarrama-result.gif?1740791319"},
        mid:{title:"Impact System",img:"https://media4.giphy.com/media/0V13xjYKqE8AL2T6UK/giphy.gif"},
        small:{title:"Energy Field",img:"https://cdna.artstation.com/p/assets/images/images/085/332/502/original/francisco-guadarrama-2025-02-2518-31-25-ezgif-com-resize.gif?1740537325"}
    },
    tools:{
        featured:{title:"Maya Validator",img:"https://i.imgur.com/pptNLiB.gif"},
        mid:{title:"Low Poly Tool",img:"https://media.giphy.com/media/YfIqRqgD6HxsPTIwfg/giphy.gif"},
        small:{title:"Workflow Tool",img:"https://i.imgur.com/pptNLiB.gif"}
    },
    threed:{
        featured:{title:"Character Rig", embed:"<iframe src='https://sketchfab.com/models/3aba64fde0264a668899d42a4ad8b98c/embed'></iframe>"},
        mid:{title:"Env Modeling", embed:"<iframe src='https://sketchfab.com/models/3aba64fde0264a668899d42a4ad8b98c/embed'></iframe>"},
        small:{title:"Animation Test", img:"https://media.giphy.com/media/xT9IgEx8SbQ0teblUQ/giphy.gif"}
    }
};

class App{
    constructor(){
        this.ship = document.getElementById("ship");
        this.shipPos = { x: innerWidth/2, y: innerHeight/2 };
        this.shipTarget = { x: this.shipPos.x, y: this.shipPos.y };
        this.velocity = 0; this.lastMouse = {x:0, y:0};
        this.trailCanvas = document.getElementById("trailCanvas");
        this.trailCtx = this.trailCanvas.getContext("2d");
        this.trailPoints = [];
        this.intensity = 0; this.isMuted = true;
        this.init();
    }

    init(){
        this.initGL();
        this.setupNav();
        this.render("shaders");
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.loop();
    }

    resize(){
        this.renderer.setSize(innerWidth, innerHeight);
        this.trailCanvas.width = innerWidth;
        this.trailCanvas.height = innerHeight;
    }

    initGL(){
        this.renderer = new THREE.WebGLRenderer({canvas: document.getElementById("webgl"), alpha: true});
        this.scene = new THREE.Scene();
        this.camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
        this.uniforms = { u_mouse:{value: new THREE.Vector2()}, u_intensity:{value:0} };
        const mat = new THREE.ShaderMaterial({
            uniforms: this.uniforms,
            vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
            fragmentShader: `precision highp float; varying vec2 vUv; uniform vec2 u_mouse; uniform float u_intensity;
                void main(){
                    float d = distance(vUv, u_mouse);
                    float glow = 0.04 / (d + 0.04);
                    gl_FragColor = vec4(vec3(0.2, 1.0, 0.4) * (glow + u_intensity*0.2), glow*0.5);
                }`
        });
        this.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));
    }

    setupNav(){
        window.onmousemove = (e) => {
            this.shipTarget.x = e.clientX; this.shipTarget.y = e.clientY;
            const dx = e.clientX - this.lastMouse.x; const dy = e.clientY - this.lastMouse.y;
            this.velocity = Math.sqrt(dx*dx + dy*dy);
            this.lastMouse = {x: e.clientX, y: e.clientY};
            this.uniforms.u_mouse.value.set(e.clientX/innerWidth, 1 - e.clientY/innerHeight);
            
            // Interaction Check
            let hit = false;
            document.querySelectorAll('.card, .filter, nav a').forEach(el => {
                const r = el.getBoundingClientRect();
                if(e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) hit = true;
            });
            this.intensity = hit ? 1.0 : 0;
        };

        document.querySelectorAll("nav a").forEach(a => {
            a.onclick = () => {
                document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
                document.getElementById(a.dataset.page).classList.add("active");
                document.querySelectorAll("nav a").forEach(l => l.classList.remove("active"));
                a.classList.add("active");
            };
        });

        document.querySelectorAll(".filter").forEach(f => {
            f.onclick = () => {
                document.querySelectorAll(".filter").forEach(x => x.classList.remove("active"));
                f.classList.add("active"); this.render(f.dataset.filter);
            };
        });

        document.getElementById("sfxToggle").onclick = () => this.toggleSfx();
    }

    toggleSfx(){
        if(!this.audioCtx){
            this.audioCtx = new AudioContext();
            this.audioEl = document.getElementById("ambience");
            const source = this.audioCtx.createMediaElementSource(this.audioEl);
            this.gainNode = this.audioCtx.createGain();
            this.filterNode = this.audioCtx.createBiquadFilter();
            this.filterNode.type = 'lowpass';
            source.connect(this.filterNode).connect(this.gainNode).connect(this.audioCtx.destination);
        }
        this.isMuted = !this.isMuted;
        this.isMuted ? this.audioEl.pause() : this.audioEl.play();
        document.getElementById("sfxToggle").textContent = `HUM: ${this.isMuted ? 'OFF' : 'ON'}`;
    }

    render(t){
        const d=PROJECTS[t]; const grid = document.getElementById("grid");
        grid.innerHTML="";
        Object.keys(d).forEach(key => {
            const proj = d[key];
            const card = document.createElement("div");
            card.className = `card ${key==='featured'?'featured':''}`;
            card.innerHTML = `<div class="image">${proj.embed || `<img src="${proj.img}">`}</div><div class="info"><h3>${proj.title}</h3></div>`;
            grid.appendChild(card);
        });
    }

    drawTrail(){
        const ctx = this.trailCtx;
        ctx.clearRect(0,0,this.trailCanvas.width, this.trailCanvas.height);
        if(this.trailPoints.length < 2) return;

        const isCutting = this.intensity > 0.5;
        ctx.lineCap = "round"; ctx.lineJoin = "round";

        // OUTER
        ctx.globalCompositeOperation = 'screen';
        ctx.strokeStyle = isCutting ? "rgba(255,100,0,0.3)" : "rgba(178,244,159,0.3)";
        ctx.lineWidth = isCutting ? 21 : 18;
        ctx.beginPath();
        ctx.moveTo(this.trailPoints[0].x, this.trailPoints[0].y);
        this.trailPoints.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.stroke();

        // CORE (+3px if cutting)
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = isCutting ? 11 : 8;
        ctx.stroke();
    }

    loop(){
        if(!this.isMuted && this.gainNode){
            this.gainNode.gain.setTargetAtTime(0.1 + (this.velocity/150), this.audioCtx.currentTime, 0.1);
            this.filterNode.frequency.setTargetAtTime(400 + (this.velocity*10), this.audioCtx.currentTime, 0.1);
        }

        this.shipPos.x += (this.shipTarget.x - this.shipPos.x) * 0.1;
        this.shipPos.y += (this.shipTarget.y - this.shipPos.y) * 0.1;
        
        const angle = Math.atan2(this.shipTarget.y - this.shipPos.y, this.shipTarget.x - this.shipPos.x);
        this.ship.style.left = `${this.shipPos.x}px`;
        this.ship.style.top = `${this.shipPos.y}px`;
        // KEY FIX: Offset translation to align TIP with mouse
        this.ship.style.transform = `translate(-100%, -50%) rotate(${angle}rad)`;

        this.trailPoints.push({x: this.shipPos.x, y: this.shipPos.y});
        if(this.trailPoints.length > 20) this.trailPoints.shift();

        this.drawTrail();
        this.uniforms.u_intensity.value = this.intensity;
        this.renderer.render(this.scene, this.camera);
        requestAnimationFrame(()=>this.loop());
    }
}

new App();
</script>
</body>
</html>
