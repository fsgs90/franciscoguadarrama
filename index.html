<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francisco Guadarrama | Tech Art</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>


<style>
:root{
--bg:#050810;
--text:#f8fafc;
--accent:#38bdf8;
--card:#111827;
--font-header:"Press Start 2P", monospace;
--font-body:"JetBrains Mono", monospace;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:var(--font-body);
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

#webgl{
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
}

/* NAV */
nav{
position:fixed;
width:100%;
display:flex;
justify-content:center;
gap:2rem;
padding:1.2rem;
background:rgba(5,8,16,0.8);
backdrop-filter:blur(10px);
z-index:10;
}

nav a{
font-family:var(--font-header);
font-size:.65rem;
color:var(--text);
opacity:.5;
cursor:pointer;
text-decoration:none;
}

nav a.active,
nav a:hover{
color:var(--accent);
opacity:1;
}

/* PAGES */
.page{
display:none;
min-height:100vh;
padding-top:120px;
}

.page.active{display:block}

/* HERO */
.hero{
height:40vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h1{
font-family:var(--font-header);
font-size:clamp(1.2rem,4vw,2.5rem);
}

.hero p{
color:var(--accent);
letter-spacing:2px;
}

/* FILTERS */
.filter-wrap{
margin-top:20px;
display:flex;
gap:10px;
}

.filter{
font-family:var(--font-header);
font-size:.55rem;
padding:.6rem .9rem;
border:1px solid rgba(56,189,248,0.3);
background:rgba(17,24,39,0.5);
color:var(--text);
cursor:pointer;
}

.filter.active{
background:var(--accent);
color:#000;
}

/* GRID */
.container{
max-width:1000px;
margin:auto;
padding:2rem;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:2rem;
}

/* CARDS */
.card{
background:var(--card);
border-radius:6px;
overflow:hidden;
position:relative;
cursor:pointer;
border:1px solid rgba(255,255,255,0.05);
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
border-color:var(--accent);
}

.card.featured{grid-column:1/3;height:380px}
.card.mid,.card.small{height:300px}

/* IMAGE */
.image{
height:75%;
position:relative;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
opacity:.7;
transition:.5s;
}

.card:hover img{
transform:scale(1.08);
opacity:1;
}

.image::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
}

/* TITLE FIX */
.info{
padding:1.2rem;
position:relative;
z-index:5;
}

.info h3{
font-family:var(--font-header);
font-size:.75rem;
margin:0;
text-shadow:0 0 10px rgba(0,0,0,0.9);
}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.modal.active{display:flex}

.modal-box{
background:#0b1220;
padding:2rem;
border:1px solid var(--accent);
width:min(700px,90vw);
border-radius:8px;
}

.modal-box h2{
margin:0 0 1rem 0;
font-family:var(--font-header);
}
footer {
    text-align: center;
    padding: 4rem;
    font-size: 0.6rem;
    font-family: var(--font-header);
    opacity: 0.6; /* keep subtle but not too low */
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.footer-links a {
    color: #38bdf8 !important;   /* force bright white */
    opacity: 1 !important;       /* kill inherited fading */
    text-decoration: none;
}

.reel {
    max-width: 1000px;
    margin: 3rem auto;
    padding: 0 2rem;
    text-align: center;
}

.reel h2 {
    font-family: var(--font-header);
    font-size: 0.7rem;
    letter-spacing: 2px;
    opacity: 0.5;
    margin-bottom: 1.5rem;
}

.reel-player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid rgba(56,189,248,0.2);
    background: #000;
}

.reel-player iframe {
    width: 100%;
    height: 100%;
}

.reel-player:hover {
    transform:translateY(-6px);
    box-shadow: 0 0 20px rgba(56,189,248,0.3);
}

#ship {
    position: fixed;
    width: 48px;
    height: 48px;
    pointer-events: none;
    z-index: 1; /* ABOVE shader, BELOW UI */
    transform: translate(-50%, -50%);
    image-rendering: pixelated;
}

</style>
</head>

<body>


<canvas id="webgl"></canvas>

<img id="ship" src="https://i.redd.it/gu8shf4fj9g71.gif"/>

<nav>
<a data-page="home" class="active">HOME</a>
<a data-page="resume">RESUME</a>
<a data-page="contact">CONTACT</a>
</nav>

<div id="home" class="page active">

<section class="hero">
<h1>FRANCISCO<br>GUADARRAMA</h1>
<p>// TECH ARTIST</p>

<div class="filter-wrap">
<button class="filter" data-filter="shaders">SHADERS</button>
<button class="filter" data-filter="vfx">VFX</button>
<button class="filter active" data-filter="pixel">PIXEL_ART</button>
<button class="filter" data-filter="tools">TOOLS</button>
</section>

<section class="reel">
    <h2>[ DEMO_REEL ]</h2>

    <div class="reel-player">
    <iframe width="560" height="315" src="https://www.youtube.com/embed/KuWTf7KrF6Y?si=OAaE6tlFgOQYLqaC" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</section>
</div>

<div class="container">
<div class="grid" id="grid"></div>
</div>

    <footer>
    <div>© 2026 Francisco Guadarrama — Real-time Systems</div>

    <div class="footer-links">
        <a href="https://github.com/fsgs90" target="_blank">GitHub</a>
        <a href="https://liquidpxl.itch.io/" target="_blank">Itch</a>
        <a href="https://franciscoguadarrama.artstation.com/" target="_blank">ArtStation</a>
        <a href="mailto:fsgs90@gmail.com">Email</a>
    </div>
</footer>
</div>

<div id="resume" class="page"><div class="hero"><h1>RESUME</h1></div></div>
<div id="contact" class="page"><div class="hero"><h1>CONTACT</h1></div></div>



<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-box">
<h2 id="modalTitle"></h2>
<img id="modalImg" style="width:100%;border-radius:6px;">
</div>
</div>

<script>

const PROJECTS={
pixel:{
featured:{title:"2D Dynamic Shadow System",img:"https://i.makeagif.com/media/4-26-2026/8c9H56.gif"},
mid:{title:"Procedural Burning Effect",img:"https://i.makeagif.com/media/4-26-2026/NvAZ5q.gif"},
small:{title:"Tile Shader",img:"https://i.imgur.com/cwDTOv8.gif"}
},
shaders:{
featured:{title:"3D Pixel Art Pipeline",img:"https://i.makeagif.com/media/4-26-2026/L1q6OG.gif"},
mid:{title:"Cross-Hatching Shader",img:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMGhpdTVrbWQ3djVoZ3RxcXl2MHA0aXhqMXhwbzY2YnRneGd1NG1laCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/lXiRIV4VyM2sBjvs4/giphy.gif"},
small:{title:"Pixel Water Shader",img:"https://cdnb.artstation.com/p/assets/images/images/014/103/113/original/brendan-sullivan-pixelwatershader1-500.gif?1542479170"}
},
vfx:{
featured:{title:"Stylized Ink Explosion",img:"https://cdna.artstation.com/p/assets/images/images/085/444/508/original/francisco-guadarrama-result.gif?1740791319"},
mid:{title:"Impact System",img:"https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExN2YwN3I1dGRrNmVhOHpnOHAyYTl0Ynp3ZzR6Mmpld2RwbWlsYmF0ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/0V13xjYKqE8AL2T6UK/giphy.gif"},
small:{title:"Energy Field System",img:"https://cdna.artstation.com/p/assets/images/images/085/332/502/original/francisco-guadarrama-2025-02-2518-31-25-ezgif-com-resize.gif?1740537325"}
},
tools:{
featured:{title:"Maya Pipeline Validator",img:"https://i.imgur.com/pptNLiB.gif"},
mid:{title:"Low Poly Tool",img:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnVtODY5eDZ6YjY4NHA0NGd4bDc1dG9lbGk4YzQ1Mjc2bWc1NmFydiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/YfIqRqgD6HxsPTIwfg/giphy.gif"},
small:{title:"Workflow Tool",img:"https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnVtODY5eDZ6YjY4NHA0NGd4bDc1dG9lbGk4YzQ1Mjc2bWc1NmFydiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/YfIqRqgD6HxsPTIwfg/giphy.gif"}
}
};

class App{

constructor(){
this.ship = document.getElementById("ship");
this.shipPos = { x: innerWidth/2, y: innerHeight/2 };
this.shipTarget = { x: this.shipPos.x, y: this.shipPos.y };

this.grid=document.getElementById("grid");

this.modal=document.getElementById("modal");
this.modalTitle=document.getElementById("modalTitle");
this.modalImg=document.getElementById("modalImg");

this.mouse=new THREE.Vector2(.5,.5);
this.target=new THREE.Vector2(.5,.5);

this.bleed=new THREE.Vector4();
this.bleedTarget=new THREE.Vector4();

this.intensity=0;

this.init();
}

init(){
this.initGL();
this.nav();
this.render("pixel");
this.loop();
}

/* ===== SHADER ===== */
initGL(){

this.renderer=new THREE.WebGLRenderer({canvas:document.getElementById("webgl"),alpha:true});
this.renderer.setSize(innerWidth,innerHeight);

this.scene=new THREE.Scene();
this.camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

this.uniforms={
u_mouse:{value:this.mouse},
u_bleed:{value:this.bleed},
u_intensity:{value:0},
u_res:{value:new THREE.Vector2(innerWidth,innerHeight)}
};

const mat=new THREE.ShaderMaterial({
uniforms:this.uniforms,
vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,
fragmentShader:`
precision highp float;
varying vec2 vUv;

uniform vec2 u_mouse;
uniform vec4 u_bleed;
uniform float u_intensity;
uniform vec2 u_res;

void main(){

vec2 uv=vUv;
float aspect=u_res.x/u_res.y;

float d=distance(uv*vec2(aspect,1.),u_mouse*vec2(aspect,1.));
float glow=0.04/(d+0.04);

float edge=
smoothstep(.15,0.,abs(uv.x-(u_bleed.x+u_bleed.z*.5))-u_bleed.z*.5)*
smoothstep(.15,0.,abs(uv.y-(u_bleed.y+u_bleed.w*.5))-u_bleed.w*.5);

vec3 col=vec3(0.2,0.7,1.0)*(glow+edge*u_intensity);

float scan=sin(uv.y*u_res.y*1.5)*.04;
col-=scan;

float v=uv.x*uv.y*(1.-uv.x)*(1.-uv.y)*20.;
col*=v;

gl_FragColor=vec4(col,(glow+edge)*.5);
}
`
});

this.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
}

/* ===== NAV ===== */
nav(){

document.querySelectorAll("nav a").forEach(a=>{
a.onclick=()=>{

document.querySelectorAll("nav a").forEach(x=>x.classList.remove("active"));
a.classList.add("active");

document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(a.dataset.page).classList.add("active");
};
});

document.querySelectorAll(".filter").forEach(b=>{
b.onclick=()=>{
document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
this.render(b.dataset.filter);
};
});

window.onmousemove=(e)=>{
this.target.set(e.clientX/innerWidth,1-e.clientY/innerHeight);

this.shipTarget.x = e.clientX;
this.shipTarget.y = e.clientY;
};
this.modal.onclick=(e)=>{
if(e.target===this.modal) this.modal.classList.remove("active");
};
}

/* ===== CARDS ===== */
card(d,t){

const c=document.createElement("div");
c.className=`card ${t}`;

c.innerHTML=`
<div class="image"><img src="${d.img}"></div>
<div class="info"><h3>${d.title}</h3></div>
`;

c.onclick=()=>{
this.modal.classList.add("active");
this.modalTitle.textContent=d.title;
this.modalImg.src=d.img;
};

c.onmouseenter=()=>{
const r=c.getBoundingClientRect();
this.bleedTarget.set(
r.left/innerWidth,
1-r.bottom/innerHeight,
r.width/innerWidth,
r.height/innerHeight
);
this.intensity=1;
};

c.onmouseleave=()=>this.intensity=0;

return c;
}

render(t){
const d=PROJECTS[t];
this.grid.innerHTML="";
this.grid.appendChild(this.card(d.featured,"featured"));
this.grid.appendChild(this.card(d.mid,"mid"));
this.grid.appendChild(this.card(d.small,"small"));
}

/* ===== LOOP ===== */
loop(){
    // smooth follow
this.shipPos.x += (this.shipTarget.x - this.shipPos.x) * 0.08;
this.shipPos.y += (this.shipTarget.y - this.shipPos.y) * 0.08;

// rotate toward movement
let dx = this.shipTarget.x - this.shipPos.x;
let dy = this.shipTarget.y - this.shipPos.y;
let angle = Math.atan2(dy, dx);

this.ship.style.transform =
`translate(${this.shipPos.x}px, ${this.shipPos.y}px) rotate(${angle}rad)`;
requestAnimationFrame(()=>this.loop());

this.mouse.lerp(this.target,0.08);
this.bleed.lerp(this.bleedTarget,0.08);

this.uniforms.u_mouse.value=this.mouse;
this.uniforms.u_bleed.value=this.bleed;
this.uniforms.u_intensity.value=this.intensity;

this.renderer.render(this.scene,this.camera);
}
}

new App();

</script>

</body>
</html>
